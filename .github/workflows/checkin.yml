name: GLaDOS 2026 Checkin

on:
  schedule:
    # 北京时间 09:30（UTC 01:30）。一天一次即可，脚本会在失败时自动重试。
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: 手动运行请选择 manual；外部定时器可不填（默认按 external）
        required: false
        default: external
        type: choice
        options:
          - manual
          - external
      diagnose_only:
        description: 只检查 Cookie 是否可读取账号状态，不签到、不兑换、不推送
        required: false
        default: false
        type: boolean

concurrency:
  group: glados-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    if: github.event_name == 'schedule' || inputs.dispatch_source == 'manual' || inputs.dispatch_source == 'external'
    runs-on: ubuntu-latest
    # 略大于 Run Checkin 步骤的 25 分钟上限，为检出与依赖安装留出余量
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      - name: Run Checkin
        run: python checkin.py
        # 单次请求超时已放宽到 120 秒（见 checkin.py 的 REQUEST_TIMEOUT）。
        # 最坏情况为 3 次重试 × 3 个域名 × 120 秒 + 2 次 60 秒间隔 ≈ 19 分钟，
        # 因此步骤上限设为 25 分钟，避免网络缓慢时被提前掐断。
        timeout-minutes: 25
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          # Must match the browser that created the current gld:sess.
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT }}
          CHECKIN_DIAGNOSTIC_ONLY: ${{ inputs.diagnose_only && 'true' || 'false' }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # PushDeer 推送通道（当前使用这个）
          PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
          PUSH_LEVEL: ${{ vars.PUSH_LEVEL || 'fail_only' }}
          EXCHANGE_PLAN: ${{ vars.EXCHANGE_PLAN || 'plan500' }}
          # 海外 runner 访问 glados 域名延迟较高，10 秒必然超时，这里放宽到 120 秒。
          GLADOS_REQUEST_TIMEOUT: '120'
          CHECKIN_MAX_ATTEMPTS: '3'
          CHECKIN_RETRY_DELAY_SECONDS: '60'
